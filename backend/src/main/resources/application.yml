server:
  port: 8080

spring:
  application:
    name: yunnan-job-monitor
  datasource:
    url: jdbc:mysql://localhost:3306/yunnan_job_monitor?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: "ChangeMeToAtLeast32CharactersSecretKey!!"
    expiration-ms: 86400000

logging:
  level:
    org.hibernate.SQL: warn
